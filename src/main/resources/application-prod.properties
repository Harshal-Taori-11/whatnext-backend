# Production Profile Configuration

# Database - Railway provides individual PG* variables
spring.datasource.url=jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:postgres}
spring.datasource.username=${PGUSER:postgres}
spring.datasource.password=${PGPASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT Configuration - MUST be set via environment variable
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# CORS - Set via environment variable
app.cors.allowed-origins=${FRONTEND_URL:https://your-app.vercel.app}

# Logging
logging.level.root=INFO
logging.level.com.whatnext=INFO
